[package]
name = "nexvault-core"
version = "0.1.0"
edition = "2021"
description = "NexVault core: signed log, envelope crypto, Noise sync over LAN/IPv6"

[lib]
name = "nexvault_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "nv"
path = "src/bin/nv.rs"

[dependencies]
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
blake3 = "1"
chacha20poly1305 = "0.10"
ciborium = "0.2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
hkdf = "0.12"
if-addrs = "0.13"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sha2 = "0.10"
snow = "0.9"
socket2 = "0.5"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { version = "1", features = ["derive"] }

[profile.release]
opt-level = "s"
lto = true
strip = true

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
