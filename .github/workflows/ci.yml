name: CI
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy, rustfmt }
      - run: cargo fmt --check
        working-directory: core
      - run: cargo clippy --release --all-targets -- -D warnings
        working-directory: core
      - run: cargo test --release
        working-directory: core
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter test
        working-directory: app
  android:
    runs-on: ubuntu-latest
    needs: [core, app]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: cargo install cargo-ndk --locked
      - run: ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: app/build/app/outputs/flutter-apk/*.apk }
